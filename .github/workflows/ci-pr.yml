name: BidMason PR CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: bash scripts/bootstrap --ci
      - name: Fast checks
        run: bash ci/run fast
  pr:
    name: pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: bash scripts/bootstrap --ci
      - name: PR checks
        run: bash ci/run pr
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security checks
        run: bash ci/run security

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Typecheck, test, and production build
        run: bash ci/run web

  win-fast:
    name: win-fast
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Windows bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -CI
      - name: Native Windows fast checks
        shell: pwsh
        run: ./ci/run.ps1 fast
      - name: Reproducible Windows dependency install
        run: npm ci --no-audit --no-fund
      - name: Windows TypeScript and unit tests
        run: |
          npm run typecheck
          npm run test:web
      - name: Windows production build
        run: npm run build

  pdf-qa:
    name: pdf-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PDF QA dependencies
        run: python3 -m pip install --requirement requirements-pdf.txt
      - name: Render and inspect all PDF pages
        run: bash ci/run pdf

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production preview
        run: npm run build
      - name: Install pinned browser QA
        run: python3 -m pip install --requirement requirements-browser.txt
      - name: Install exact Playwright Chromium revision
        run: python3 -m playwright install --with-deps chromium
      - name: Chromium mobile, keyboard and disabled-intake E2E
        run: python3 ci/browser_qa.py

  proposal-pdf-qa:
    name: proposal-pdf-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PDF QA dependencies
        run: python3 -m pip install --requirement requirements-pdf.txt
      - name: Multi-company PDF render, geometry, and rejection checks
        run: python3 ci/branded_pdf_qa.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Python PDF to TypeScript QA revision contract
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          python3 ci/proposal_contract_export.py "$directory"
          node ci/export_synthetic_review.mjs "$directory" "$directory"
          python3 ci/proposal_review_markup_qa.py "$directory"
          PROPOSAL_CONTRACT_DIR="$directory" node --test ci/proposal_artifact_contract.test.mjs

name: BidMason PR CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: bash scripts/bootstrap --ci
      - name: Fast checks
        run: bash ci/run fast
  pr:
    name: pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: bash scripts/bootstrap --ci
      - name: PR checks
        run: bash ci/run pr
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security checks
        run: bash ci/run security

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Resolve pinned preview dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and production build
        run: bash ci/run web
      - name: Emit package lock for reproducibility (temporary bootstrap)
        run: |
          echo BIDMASON_LOCK_BEGIN
          base64 -w 0 package-lock.json
          echo
          echo BIDMASON_LOCK_END

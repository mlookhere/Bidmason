name: BidMason PR CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: bash scripts/bootstrap --ci
      - name: Fast checks
        run: bash ci/run fast
  pr:
    name: pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: bash scripts/bootstrap --ci
      - name: PR checks
        run: bash ci/run pr
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security checks
        run: bash ci/run security

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Typecheck, test, and production build
        run: bash ci/run web

  win-fast:
    name: win-fast
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Windows bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -CI
      - name: Native Windows fast checks
        shell: pwsh
        run: ./ci/run.ps1 fast
      - name: Reproducible Windows dependency install
        run: npm ci --no-audit --no-fund
      - name: Windows TypeScript and unit tests
        run: |
          npm run typecheck
          npm run test:web
      - name: Windows production build
        run: npm run build

  pdf-qa:
    name: pdf-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PDF QA dependencies
        run: python3 -m pip install --requirement requirements-pdf.txt
      - name: Render and inspect all PDF pages
        run: bash ci/run pdf

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: "24"
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production preview
        run: npm run build
      - name: Install pinned browser QA
        run: python3 -m pip install --requirement requirements-browser.txt
      - name: Install exact Playwright Chromium revision
        run: python3 -m playwright install --with-deps chromium
      - name: Chromium mobile, keyboard and disabled-intake E2E
        run: python3 ci/browser_qa.py

  db-rls:
    name: db-rls
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-isolated-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ci-isolated-database-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated Supabase auth contract
        run: psql -X -v ON_ERROR_STOP=1 -f ci/db_auth_stub.sql
      - name: Install proposed tenant tables and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Exercise two-tenant authorization and revision approval
        run: psql -X -v ON_ERROR_STOP=1 -f ci/db_rls_test.sql
      - name: Install evidence receipt FK and authorization policy
        run: psql -X -v ON_ERROR_STOP=1 -f db/evidence_receipts.sql
      - name: Enforce independent verification of business facts
        run: psql -X -v ON_ERROR_STOP=1 -f db/review_independence.sql
      - name: Seed server-only synthetic ingestion receipts
        run: psql -X -v ON_ERROR_STOP=1 -f ci/db_receipt_seed.sql
      - name: Verify independent evidence review and audit immutability
        run: psql -X -v ON_ERROR_STOP=1 -f ci/db_fact_review_test.sql
      - name: Stub Supabase Storage tables for isolated CI only
        run: psql -X -v ON_ERROR_STOP=1 -f ci/db_storage_stub.sql
      - name: Install tenant-private evidence storage rules
        run: psql -X -v ON_ERROR_STOP=1 -f db/storage_policies.sql
      - name: Verify storage RLS and unauthorized mutations
        run: psql -X -v ON_ERROR_STOP=1 -f ci/db_storage_test.sql
      - name: Audit the complete Storage policy set and inject unsafe policies
        run: psql -X -v ON_ERROR_STOP=1 -f db/storage_policy_audit.sql -f ci/db_storage_audit_test.sql
      - name: Deny forged, missing or cross-tenant evidence receipts
        run: psql -X -v ON_ERROR_STOP=1 -f ci/db_receipt_test.sql
      - name: Verify deterministic candidate migration is up to date
        run: python3 scripts/build_migration.py --check
      - name: Create a second empty database for candidate migration replay
        run: createdb bm_migration_ci
      - name: Bootstrap only local auth and Storage compatibility stubs
        run: |
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f ci/db_auth_stub.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f ci/db_storage_stub.sql
      - name: Replay all four actual managed Supabase migrations
        run: |
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261017035109_bidmason_tenant_foundation.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261017035151_bidmason_evidence_storage.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261017035730_bidmason_evidence_review_fk_index.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261017063426_bidmason_independent_fact_review.sql
      - name: Re-run all positive and adversarial tenant tests on the migration
        run: |
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f ci/db_rls_test.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f ci/db_receipt_seed.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f ci/db_fact_review_test.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f ci/db_storage_test.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f db/storage_policy_audit.sql -f ci/db_storage_audit_test.sql
          PGDATABASE=bm_migration_ci psql -X -v ON_ERROR_STOP=1 -f ci/db_receipt_test.sql

